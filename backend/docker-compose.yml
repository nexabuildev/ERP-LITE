
services:
  postgres:
    image: postgres:15-alpine
    container_name: erp-lite-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ruben
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: erplite_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: