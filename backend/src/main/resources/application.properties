# --- CONEXIÓN A POSTGRESQL ---
# En local usa el Postgres de docker-compose (valores por defecto).
# En Render, define DATABASE_URL/DATABASE_USERNAME/DATABASE_PASSWORD apuntando a Neon.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/erplite_db}
spring.datasource.username=${DATABASE_USERNAME:ruben}
spring.datasource.password=${DATABASE_PASSWORD:password123}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- SERVIDOR ---
# Render inyecta PORT en runtime; en local cae a 8080.
server.port=${PORT:8080}

# --- COMPORTAMIENTO DE JPA ---
# "update": Actualiza las tablas si cambias el código, pero NO borra los datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- BUENAS PRÁCTICAS ---
spring.jpa.open-in-view=false

# --- CORS ---
# Lista separada por comas. En Render, apunta a la URL de Cloudflare Pages.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- ERRORES ---
# Sin esto, Spring Boot 3 oculta el mensaje real de las excepciones (ej: email duplicado)
server.error.include-message=always

# --- JWT ---
# En Render, define JWT_SECRET_KEY con un valor propio (256 bits en base64).
application.security.jwt.secret-key=${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
